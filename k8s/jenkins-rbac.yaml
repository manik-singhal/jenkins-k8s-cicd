apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
rules:
  - apiGroups: ["", "apps", "autoscaling"]
    resources:
      - deployments
      - replicasets
      - services
      - pods
      - pods/log
      - pods/exec
      - configmaps
      - secrets
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer-sa
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
