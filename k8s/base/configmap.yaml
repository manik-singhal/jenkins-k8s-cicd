apiVersion: v1
kind: ConfigMap
metadata:
  name: toorak-lending-config
  labels:
    app: toorak-lending-api
data:
  APP_NAME: "Toorak Lending Engine API"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: toorak-lending-hpa
  labels:
    app: toorak-lending-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: toorak-lending-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
